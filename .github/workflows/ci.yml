name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check / build
        run: npm run build

      - name: Smoke start (boot + SIGTERM)
        run: |
          # Portable boot smoke: start the server in the background,
          # give it 3s to come up, capture stderr, then SIGTERM.
          # macOS-latest does not ship GNU `timeout`, so we avoid it.
          node dist/index.js < /dev/null 2>boot.stderr &
          PID=$!
          sleep 3
          kill -TERM "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          echo "--- boot stderr ---"
          cat boot.stderr

          # The product surface is exactly one tool. Anything more or less is
          # a wiring regression.
          if ! grep -q "  - transaction$" boot.stderr; then
            echo "Boot smoke failed: expected 'transaction' to be registered"
            exit 1
          fi
          if ! grep -q "Total commands: 1$" boot.stderr; then
            echo "Boot smoke failed: expected exactly 1 registered command"
            exit 1
          fi
          echo "Boot smoke: 1 tool (transaction) registered as expected."
